<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" role="img" aria-labelledby="t d"><title id="t">Web application request lifecycle</title><desc id="d">A browser sends an HTTP request through a web server to application logic and a data store, then receives a response.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#087E8B"/></marker></defs><rect width="1100" height="360" rx="20" fill="#F3F7FA"/><text x="45" y="52" font-family="Arial" font-size="27" font-weight="bold" fill="#14243A">What happens after the browser sends a request?</text><g font-family="Arial" text-anchor="middle"><rect x="50" y="115" width="205" height="105" rx="13" fill="#14243A"/><text x="152" y="158" font-size="20" font-weight="bold" fill="#fff">Browser</text><text x="152" y="188" font-size="14" fill="#DCE7EF">HTTP request</text><rect x="335" y="115" width="205" height="105" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="437" y="158" font-size="20" font-weight="bold" fill="#14243A">Web server</text><text x="437" y="188" font-size="14" fill="#526579">Routing / TLS</text><rect x="620" y="115" width="205" height="105" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="722" y="158" font-size="20" font-weight="bold" fill="#14243A">Application</text><text x="722" y="188" font-size="14" fill="#526579">Auth / business logic</text><rect x="905" y="115" width="150" height="105" rx="13" fill="#FFF4DF" stroke="#D99124" stroke-width="2"/><text x="980" y="158" font-size="20" font-weight="bold" fill="#14243A">Data</text><text x="980" y="188" font-size="14" fill="#526579">Database</text></g><g stroke="#087E8B" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M257 150H327M542 150H612M827 150H897"/></g><g font-family="Arial" font-size="13" fill="#526579" text-anchor="middle"><text x="292" y="135">Request</text><text x="577" y="135">Route</text><text x="862" y="135">Query</text></g><path d="M980 230V270H152V230" stroke="#D99124" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="565" y="298" text-anchor="middle" font-family="Arial" font-size="15" fill="#526579">Response returns with a status code, headers, and optional body.</text><text x="565" y="330" text-anchor="middle" font-family="Arial" font-size="13" fill="#526579">Test trust boundaries: input handling, authentication, authorization, sessions, and data access.</text></svg>