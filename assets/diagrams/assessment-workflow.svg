<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="t d"><title id="t">Authorized assessment workflow</title><desc id="d">Six stages from scope to reporting.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#087E8B"/></marker></defs><rect width="1200" height="310" rx="20" fill="#F3F7FA"/><text x="45" y="52" font-family="Arial" font-size="27" font-weight="bold" fill="#14243A">A repeatable assessment workflow</text><text x="45" y="78" font-family="Arial" font-size="15" fill="#526579">Stay inside the agreed scope at every stage.</text><g font-family="Arial" text-anchor="middle"><g><rect x="40" y="120" width="160" height="105" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="120" y="160" font-size="20" font-weight="bold" fill="#14243A">1 · Scope</text><text x="120" y="190" font-size="14" fill="#526579">Targets &amp; rules</text></g><g><rect x="240" y="120" width="160" height="105" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="320" y="160" font-size="20" font-weight="bold" fill="#14243A">2 · Discover</text><text x="320" y="190" font-size="14" fill="#526579">Passive &amp; active</text></g><g><rect x="440" y="120" width="160" height="105" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="520" y="160" font-size="20" font-weight="bold" fill="#14243A">3 · Enumerate</text><text x="520" y="190" font-size="14" fill="#526579">Services &amp; context</text></g><g><rect x="640" y="120" width="160" height="105" rx="13" fill="#FFF4DF" stroke="#D99124" stroke-width="2"/><text x="720" y="160" font-size="20" font-weight="bold" fill="#14243A">4 · Validate</text><text x="720" y="190" font-size="14" fill="#526579">Evidence &amp; impact</text></g><g><rect x="840" y="120" width="160" height="105" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="920" y="160" font-size="20" font-weight="bold" fill="#14243A">5 · Test</text><text x="920" y="190" font-size="14" fill="#526579">Controlled proof</text></g><g><rect x="1040" y="120" width="120" height="105" rx="13" fill="#14243A"/><text x="1100" y="160" font-size="20" font-weight="bold" fill="#fff">6 · Report</text><text x="1100" y="190" font-size="14" fill="#DCE7EF">Retest</text></g></g><g stroke="#087E8B" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M202 172H232M402 172H432M602 172H632M802 172H832M1002 172H1032"/></g><text x="600" y="270" text-anchor="middle" font-family="Arial" font-size="14" fill="#526579">If scope, safety, or evidence is uncertain, pause and clarify before proceeding.</text></svg>