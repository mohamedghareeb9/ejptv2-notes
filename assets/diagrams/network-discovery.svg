<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">Network discovery and enumeration</title><desc id="d">A scoped range leads to host discovery, port scanning, service identification, and protocol enumeration.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#087E8B"/></marker></defs><rect width="1100" height="390" rx="20" fill="#F3F7FA"/><text x="45" y="52" font-family="Arial" font-size="27" font-weight="bold" fill="#14243A">From network scope to service context</text><g font-family="Arial" text-anchor="middle"><rect x="45" y="125" width="190" height="100" rx="13" fill="#14243A"/><text x="140" y="165" font-size="19" font-weight="bold" fill="#fff">In-scope range</text><text x="140" y="193" font-size="14" fill="#DCE7EF">Approved targets</text><rect x="300" y="125" width="190" height="100" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="395" y="165" font-size="19" font-weight="bold" fill="#14243A">Host discovery</text><text x="395" y="193" font-size="14" fill="#526579">Which systems respond?</text><rect x="555" y="125" width="190" height="100" rx="13" fill="#E8F3F4" stroke="#087E8B" stroke-width="2"/><text x="650" y="165" font-size="19" font-weight="bold" fill="#14243A">Port scanning</text><text x="650" y="193" font-size="14" fill="#526579">Which ports are open?</text><rect x="810" y="125" width="245" height="100" rx="13" fill="#FFF4DF" stroke="#D99124" stroke-width="2"/><text x="932" y="165" font-size="19" font-weight="bold" fill="#14243A">Service identification</text><text x="932" y="193" font-size="14" fill="#526579">Version, protocol, evidence</text></g><g stroke="#087E8B" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M237 175H292M492 175H547M747 175H802"/></g><path d="M932 226V270H550" stroke="#087E8B" stroke-width="2.5" fill="none"/><g font-family="Arial" text-anchor="middle"><rect x="55" y="290" width="220" height="65" rx="11" fill="#fff" stroke="#B8C8D6"/><text x="165" y="316" font-size="16" font-weight="bold" fill="#14243A">SMB / Windows</text><text x="165" y="339" font-size="13" fill="#526579">Shares, users, domain clues</text><rect x="315" y="290" width="220" height="65" rx="11" fill="#fff" stroke="#B8C8D6"/><text x="425" y="316" font-size="16" font-weight="bold" fill="#14243A">HTTP / HTTPS</text><text x="425" y="339" font-size="13" fill="#526579">Titles, paths, technologies</text><rect x="575" y="290" width="220" height="65" rx="11" fill="#fff" stroke="#B8C8D6"/><text x="685" y="316" font-size="16" font-weight="bold" fill="#14243A">FTP / SSH</text><text x="685" y="339" font-size="13" fill="#526579">Access policy, banners</text><rect x="835" y="290" width="220" height="65" rx="11" fill="#fff" stroke="#B8C8D6"/><text x="945" y="316" font-size="16" font-weight="bold" fill="#14243A">Other services</text><text x="945" y="339" font-size="13" fill="#526579">Protocol-specific checks</text></g></svg>